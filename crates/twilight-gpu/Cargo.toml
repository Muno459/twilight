[package]
name = "twilight-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metal GPU compute backend for twilight MCRT"

[features]
default = []
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:block2"]
# Portable WebGPU backend (Vulkan / DX12 / Metal-via-wgpu / GL). Runs the
# WGSL translation of the same transport on any wgpu-supported adapter,
# including headless Linux servers and NVIDIA hardware.
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
twilight-core = { workspace = true }
twilight-data = { workspace = true }
twilight-threshold = { workspace = true }
twilight-skyglow = { workspace = true }

# wgpu backend (portable: Vulkan / DX12 / Metal / GL)
wgpu = { version = "28", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

# Metal backend: Apple-only bindings live under a target table so the
# `metal` feature is a safe no-op on other platforms (a Linux workspace
# check with the feature enabled must not try to compile objc2, which
# has a hard compile_error off Apple targets).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSError", "NSString"] }
objc2-metal = { version = "0.3", optional = true, features = [
    "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLComputeCommandEncoder",
    "MTLComputePipeline", "MTLLibrary", "MTLResource", "MTLBuffer",
    "MTLArgument", "MTLCommandEncoder", "MTLTypes",
] }
block2 = { version = "0.6", optional = true }

[dev-dependencies]
twilight-cpu = { workspace = true }
twilight-weather = { workspace = true }
