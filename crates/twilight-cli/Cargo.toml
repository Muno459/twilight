[package]
name = "twilight-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface: twilight simulation and Quranic dawn/dusk (prayer time) computation"

[features]
default = ["gpu"]
gpu = ["dep:twilight-gpu", "twilight-cpu/gpu"]

[dependencies]
twilight-core = { workspace = true }
twilight-solar = { workspace = true }
twilight-data = { workspace = true }
twilight-cpu = { path = "../twilight-cpu" }
twilight-threshold = { workspace = true }
twilight-weather = { workspace = true }
twilight-terrain = { workspace = true }
twilight-skyglow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
image = "0.25.10"
rayon = "1.11.0"
tzf-rs = "1.3.3"
chrono = "0.4.45"
chrono-tz = "0.10.4"

# Backend by platform: Metal on macOS, portable wgpu elsewhere (the
# Linux CI check compiled objc2 through the unconditional metal feature
# and died on objc2's Apple-only compile_error).
[target.'cfg(target_os = "macos")'.dependencies]
twilight-gpu = { workspace = true, optional = true, features = ["metal"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
twilight-gpu = { workspace = true, optional = true, features = ["wgpu"] }
