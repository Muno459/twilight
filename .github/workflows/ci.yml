name: CI

on:
  push:
    branches: [main, dev, overhaul, field-perf, validation-campaigns]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly heavy-gate run (Mondays 02:00 UTC); the default suites
    # deliberately keep the multi-hour MC gates behind #[ignore], so
    # without this job the load-bearing physics gates never run in CI.
    - cron: "0 2 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard project rule: no em or en dashes anywhere in sources, docs,
      # or tooling (enforced on git history as well).
      - name: No em/en dashes
        run: |
          if grep -rnP '\xe2\x80\x94|\xe2\x80\x93' \
              --include='*.rs' --include='*.py' --include='*.md' \
              --include='*.metal' --include='*.toml' \
              crates tools docs README.md 2>/dev/null; then
            echo 'em/en dash found (project hard rule)'; exit 1
          fi

  test:
    name: Default suites (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check (all targets)
        run: cargo check --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Release mode: the MC tests are calibrated for release; debug
      # runs of them take CPU-hours (documented project convention).
      - name: Test (release, default suites)
        run: cargo test --workspace --release

  test-macos:
    name: Default suites + Metal + wgpu (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub arm64 macOS runners expose a Metal device, so the GPU
      # parity suite runs for real here (device-present init failure
      # PANICS by design; only a truly absent device skips).
      - name: Test with Metal and wgpu (release)
        run: cargo test --workspace --release --features "twilight-gpu/metal twilight-gpu/wgpu"

  gpu-physics-gates:
    name: GPU physics gates (ignored suite, macOS)
    # The review found the heavy job was ubuntu-only and scoped to
    # core+cpu, so no ignored GPU physics gate EVER ran in CI. This job
    # runs them on real Metal hardware weekly and on dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The synthetic (no-external-file) gates: checkerboard DDA parity,
      # clear-sky and uniform/checkerboard field MC parity, on both
      # backends. The two real-field tests need the local
      # /tmp/padborg_field.bin snapshot (they panic by design when it is
      # absent), so CI skips them by name; run them locally.
      - name: Metal + wgpu ignored gates
        run: >
          cargo test -p twilight-gpu --release --features "metal wgpu" --
          --ignored
          --skip metal_field_mc_parity_padborg
          --skip metal_field_hybrid_perf_probe

  heavy-gates:
    name: Physics gates (${{ matrix.shard.name }})
    # Scheduled weekly and on manual dispatch only. One job ran past the
    # 5 h cap on a 4-core runner, mostly on diagnostic dumps, so the
    # gates are sharded by family and the diagnostics stay local
    # (cv_*, *_dump, deep_referee_runner, g_s3_cb_zenith_probe).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: core + g_s2
            core: true
            filter: g_s2_ stratus_twilight
          - name: g_s3
            core: false
            filter: g_s3_ --skip g_s3_cb_zenith_probe
          - name: slab referee + BDPT
            core: false
            filter: diag_g2_slab g_bdpt_
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The libRadtran tiers (g2/g3) need a local libRadtran build and
      # stay manual; everything else runs here.
      - name: Core ignored gates
        if: matrix.shard.core
        run: cargo test -p twilight-core --release -- --ignored
      - name: CPU ignored gates
        run: cargo test -p twilight-cpu --release -- --ignored ${{ matrix.shard.filter }}
